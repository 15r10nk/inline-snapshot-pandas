name: General Setup
description: Set up uv and install Python
inputs:
  python-version:  # id of input
    description: the python version to use
    required: false

    default: '3.13'

runs:
  using: composite
  steps:
  - name: Install uv
    uses: astral-sh/setup-uv@v5
    with:
      python-version: ${{inputs.python-version}}

  - name: Install Python
    shell: bash
    run: uv python install
