[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/inline_snapshot_pandas"]

[project]
authors = [
  { name = "Frank Hoffmann", email = "15r10nk@polarbit.de" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy"
]
dependencies = [
  "pandas>=2.3.3",
  "inline-snapshot>=0.37.0"
]
description = 'pandas integration for inline-snapshot'
keywords = []
license = "MIT"
name = "inline-snapshot-pandas"
readme = "README.md"
requires-python = ">=3.9"
version = "0.2.1"

[dependency-groups]
cog = [
  "cogapp>=3.4.1",
]
dev = [
  "coverage>=7.6.1",
  "inline-snapshot[black]>=0.37.0",
  "pytest>=8.3.5",
  "pandas-stubs>=2.2.2.240807",
  "commitizen==4.16.5; python_version >= '3.10'",
  "scriv==1.8.0; python_version >= '3.10'",
]

[project.urls]
Documentation = "https://github.com/15r10nk/inline-snapshot-pandas#readme"
Issues = "https://github.com/15r10nk/inline-snapshot-pandas/issues"
Source = "https://github.com/15r10nk/inline-snapshot-pandas"

[tool.black]
target-version = ["py39"]

[tool.isort]
profile = "black"

[tool.commitizen]
major_version_zero = true
tag_format = "v$major.$minor.$patch$prerelease"
version_scheme = "semver2"
version_provider = "pep621"

[tool.scriv]
format = "md"

[tool.coverage.paths]
inline_snapshot_pandas = ["src/inline_snapshot_pandas", "*/inline-snapshot-pandas/src/inline_snapshot_pandas"]
tests = ["tests", "*/inline-snapshot-pandas/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:"
]

[tool.coverage.run]
source = ["inline_snapshot_pandas"]
branch = true
data_file = "$TOP/.coverage"
omit = [
  "src/inline_snapshot_pandas/__about__.py"
]
parallel = true

[tool.hatch.envs.default]
scripts.test = "pytest {args:tests}"
dependencies = [
  "pytest",
  "pytest-xdist"
]

[tool.hatch.envs.hatch-test]
extra-dependencies = ["inline-snapshot[black]"]
dependencies = [
  "coverage[toml]>=6.5",
  "coverage-enable-subprocess",
  "pytest",
  "pytest-xdist"
]
env-vars.TOP = "{root}"
default-args = ["tests"]
scripts.run = "coverage run -m pytest {args}"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]



[tool.hatch.envs.cov]
dependencies = ["coverage[toml]>=6.5"]
detached = true
env-vars.TOP = "{root}"
scripts.test = [
  "- coverage erase",
  "hatch test --cover-quiet {args}",
  "coverage combine",
  "coverage html",
  "coverage report  --fail-under 100 "
]
